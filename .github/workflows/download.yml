name: Download authorized video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct MP4/WebM URL, or a supported page for authorized media"
        required: true
        type: string
      format:
        description: "Output format (for page extraction)"
        required: true
        type: choice
        options:
          - "MP4 when available"
          - "Best available original format"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate URL
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["VIDEO_URL"].strip())
          if u.scheme not in ("http", "https") or not u.hostname:
              raise SystemExit("Enter a valid http(s) URL.")
          if u.username or u.password:
              raise SystemExit("URLs with embedded credentials are not accepted.")
          PY

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Download authorized media
        id: download
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          FORMAT_CHOICE: ${{ inputs.format }}
        run: |
          mkdir -p downloads diagnostics
          URL_PATH="${VIDEO_URL%%\?*}"
          URL_PATH="${URL_PATH,,}"
          set +e
          case "$URL_PATH" in
            *.mp4|*.m4v|*.webm|*.mov|*.mkv)
              echo "Input type: direct video file"
              curl --fail --location --show-error --silent \
                --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 1800 \
                --output downloads/video-file "$VIDEO_URL" \
                2>diagnostics/curl-error.log
              RESULT=$?
              METHOD="direct HTTP file download"
              if [ "$RESULT" -eq 0 ] && [ -s downloads/video-file ]; then
                MIME="$(file --brief --mime-type downloads/video-file)"
                case "$MIME" in
                  video/mp4) EXT="mp4" ;;
                  video/webm) EXT="webm" ;;
                  video/quicktime) EXT="mov" ;;
                  video/x-matroska) EXT="mkv" ;;
                  application/octet-stream)
                    EXT="${URL_PATH##*.}"
                    ;;
                  *)
                    echo "Server response is not recognized as a video file (MIME: $MIME)." > diagnostics/curl-error.log
                    RESULT=22
                    EXT="bin"
                    ;;
                esac
                if [ "$RESULT" -eq 0 ]; then
                  mv downloads/video-file "downloads/video-file.$EXT"
                fi
              fi
              ;;
            *)
              echo "Input type: webpage/extractor URL"
              if [ "$FORMAT_CHOICE" = "MP4 when available" ]; then
                FORMAT="bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b"
                MERGE="mp4"
              else
                FORMAT="bv*+ba/b"
                MERGE="mkv"
              fi
              yt-dlp --no-playlist --format "$FORMAT" --merge-output-format "$MERGE" \
                --output "downloads/%(title).160B.%(ext)s" -- "$VIDEO_URL" \
                > diagnostics/yt-dlp-private.log 2>&1
              RESULT=$?
              METHOD="yt-dlp webpage extraction"
              ;;
          esac
          set -e

          python - "$RESULT" "$METHOD" <<'PY'
          import sys
          from pathlib import Path
          code, method = int(sys.argv[1]), sys.argv[2]
          logs = []
          for name in ("curl-error.log", "yt-dlp-private.log"):
              p = Path("diagnostics") / name
              if p.exists():
                  logs.append(p.read_text(errors="replace").lower())
          log = "\n".join(logs)
          if code == 0 and any(Path("downloads").iterdir()):
              category = "Download completed"
              explanation = "The authorized video file was saved."
          elif "http error 403" in log or "403 forbidden" in log:
              category = "HTTP 403: source denied this request"
              explanation = "The host denied the request from the GitHub runner. This is not automatically proof of Cloudflare; check the host's access policy or use its official export."
          elif "cloudflare" in log or "captcha" in log:
              category = "Anti-bot challenge detected"
              explanation = "The source presented an anti-bot challenge. The workflow does not attempt to evade it."
          elif "404" in log or "not found" in log:
              category = "File or page not found"
              explanation = "The supplied URL may be expired, incorrect, or no longer available."
          elif "drm" in log or "widevine" in log or "license" in log:
              category = "Possible DRM-protected stream"
              explanation = "Protected playback cannot be decrypted by this workflow."
          elif "unsupported url" in log or "no suitable extractor" in log:
              category = "Unsupported website"
              explanation = "yt-dlp has no compatible extractor for this page."
          elif "timed out" in log or "timeout" in log:
              category = "Network timeout"
              explanation = "The server did not respond within the allowed time."
          elif "ssl" in log or "certificate" in log:
              category = "TLS/certificate error"
              explanation = "The connection could not be verified securely."
          else:
              category = "Download failed (unclassified)"
              explanation = "Review the job step output for the reported HTTP, TLS, or network error."
          Path("diagnostics/REPORT.md").write_text(
              "# Download diagnostic report\n\n"
              f"- **Result:** {category}\n"
              f"- **Method:** {method}\n"
              f"- **Exit code:** {code}\n\n"
              f"{explanation}\n\n"
              "The workflow does not bypass anti-bot controls, authentication, paywalls, or DRM. "
              "Diagnostic artifacts intentionally exclude raw logs, signed URLs, cookies, and credentials.\n"
          )
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"exit_code={code}\n")
              f.write(f"category={category}\n")
          print(f"Diagnostic: {category}")
          print(f"Method: {method}")
          print(explanation)
          PY

      - name: Create ZIP
        if: steps.download.outputs.exit_code == '0'
        run: |
          test -n "$(find downloads -maxdepth 1 -type f -print -quit)"
          cd downloads
          zip -9 -r ../video-download.zip .

      - name: Upload downloadable video
        if: steps.download.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: video-download
          path: video-download.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostic report
        if: always() && steps.download.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: video-diagnostics
          path: diagnostics/REPORT.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Mark run failed when download failed
        if: steps.download.outputs.exit_code != '0'
        run: |
          echo "::error::${{ steps.download.outputs.category || 'The download step did not complete.' }}"
          exit 1
